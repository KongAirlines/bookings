_format_version: "1.0"
add-plugins:
  - selectors:
      - $..services[*]
    plugins:
      - name: jwt
        enabled: true
        config:
          claims_to_verify:
            - exp
          cookie_names: []
          header_names:
            - authorization
          key_claim_name: iss
          run_on_preflight: false
          secret_is_base64: false
          uri_param_names: []
