_format_version: "3.0"
_info:
  select_tags:
  - scope-bookings-dev
services:
- host: api.kong-air.com
  id: a563ffba-c768-5dee-82ca-5eeedfba025c
  name: bookings-dev
  path: /
  plugins:
  - config:
      access:
      - |
        -- ACE (priority 955) authenticates and authorizes the Portal application.
        -- This post-function runs afterwards; never trust client identity headers.
        kong.service.request.clear_header("X-KongAir-Account-ID")
        kong.service.request.clear_header("X-Consumer-Username")
        local consumer = kong.client.get_consumer()
        -- ACE's request context is populated from validated credentials,
        -- independently of optional Kong Identity Consumer mapping (Gateway 3.16).
        local ace = kong.ctx.shared.ace
        local application_id = ace and ace.application_id
        if (consumer and consumer.username == "kongairlines-anonymous")
            or not application_id then
          return kong.response.exit(401, { message = "An approved Portal application API key is required" })
        end
        kong.service.request.set_header("X-KongAir-Account-ID", application_id)
        kong.service.request.clear_header("X-API-Key")
    name: post-function
    tags:
    - env-dev
    - team-customer-data
    - owner-bookings
    - scope-bookings-dev
  port: 443
  protocol: https
  routes:
  - id: ed9b3087-94da-5d6a-b1f2-3e2d3d73c060
    methods:
    - GET
    name: bookings-dev_get-bookings
    paths:
    - ~/bookings$
    plugins: []
    regex_priority: 200
    strip_path: false
    tags:
    - env-dev
    - team-customer-data
    - owner-bookings
    - scope-bookings-dev
  - id: cd66b622-1cd6-5506-bf32-fb26c96c2c7e
    methods:
    - POST
    name: bookings-dev_post-booking
    paths:
    - ~/bookings$
    plugins: []
    regex_priority: 200
    strip_path: false
    tags:
    - env-dev
    - team-customer-data
    - owner-bookings
    - scope-bookings-dev
  - id: a9234dfa-5ce5-5a7e-9413-e4da846a549d
    methods:
    - GET
    name: bookings-dev_get-booking-by-ticket-number
    paths:
    - ~/bookings/(?<ticketnumber>[^#?/]+)$
    plugins: []
    regex_priority: 100
    strip_path: false
    tags:
    - env-dev
    - team-customer-data
    - owner-bookings
    - scope-bookings-dev
  tags:
  - env-dev
  - team-customer-data
  - owner-bookings
  - scope-bookings-dev
upstreams: []
