_format_version: "3.0"
_info:
  select_tags:
  - env-prod
services:
- host: api.kong-air.com
  id: 5c988aec-f4c9-5cd6-9be7-e88d720de160
  name: bookings-prod
  path: /
  plugins:
  - config:
      access:
      - |
        -- ACE (priority 955) authenticates and authorizes the Portal application.
        -- This post-function runs afterwards; never trust client identity headers.
        kong.service.request.clear_header("X-KongAir-Account-ID")
        kong.service.request.clear_header("X-Consumer-Username")
        local consumer = kong.client.get_consumer()
        -- ACE's request context is populated from validated credentials,
        -- independently of optional Kong Identity Consumer mapping (Gateway 3.16).
        local ace = kong.ctx.shared.ace
        local application_id = ace and ace.application_id
        if (consumer and consumer.username == "kongairlines-anonymous")
            or not application_id then
          return kong.response.exit(401, { message = "An approved Portal application API key is required" })
        end
        kong.service.request.set_header("X-KongAir-Account-ID", application_id)
        kong.service.request.clear_header("X-API-Key")
    name: post-function
    tags:
    - env-prod
    - team-customer-data
    - owner-bookings
    - scope-bookings-prod
  port: 443
  protocol: https
  routes:
  - id: dff3f8f6-1680-5e24-8be5-e97ceadcaae9
    methods:
    - GET
    name: bookings-prod_get-bookings
    paths:
    - ~/bookings$
    plugins: []
    regex_priority: 200
    strip_path: false
    tags:
    - env-prod
    - team-customer-data
    - owner-bookings
    - scope-bookings-prod
  - id: 034be3c0-5051-5da0-a049-a80ff28c8253
    methods:
    - POST
    name: bookings-prod_post-booking
    paths:
    - ~/bookings$
    plugins: []
    regex_priority: 200
    strip_path: false
    tags:
    - env-prod
    - team-customer-data
    - owner-bookings
    - scope-bookings-prod
  - id: 8f734c52-564e-52a3-bd95-31301ba0a035
    methods:
    - GET
    name: bookings-prod_get-booking-by-ticket-number
    paths:
    - ~/bookings/(?<ticketnumber>[^#?/]+)$
    plugins: []
    regex_priority: 100
    strip_path: false
    tags:
    - env-prod
    - team-customer-data
    - owner-bookings
    - scope-bookings-prod
  tags:
  - env-prod
  - team-customer-data
  - owner-bookings
  - scope-bookings-prod
upstreams: []
